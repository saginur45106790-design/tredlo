services:
  - type: web
    name: tredlo-api
    runtime: node
    rootDir: apps/api
    buildCommand: npm install && npm run db:generate && npm run build
    startCommand: npm run db:push && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: tredlo-db, property: connectionString}
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://YOUR-WEB-DOMAIN
  - type: web
    name: tredlo-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://YOUR-API-DOMAIN
      - key: NEXT_PUBLIC_WS_URL
        value: wss://YOUR-API-DOMAIN/ws
databases:
  - name: tredlo-db
    databaseName: tredlo
    user: tredlo
    plan: free
